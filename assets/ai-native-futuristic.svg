<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.48" stop-color="#0B1538"/>
      <stop offset="1" stop-color="#120A2E"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0" cy="0" r="1" gradientTransform="translate(260 170) rotate(35) scale(260 150)">
      <stop stop-color="#00E5FF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0" cy="0" r="1" gradientTransform="translate(930 150) rotate(145) scale(310 170)">
      <stop stop-color="#8B5CF6" stop-opacity=".38"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="160" y1="0" x2="1040" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".25" stop-color="#22D3EE"/>
      <stop offset=".75" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#6EA8FE" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="30" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="30" fill="url(#orb1)"/>
  <rect width="1200" height="360" rx="30" fill="url(#orb2)"/>

  <g opacity=".7">
    <circle cx="110" cy="86" r="3" fill="#22D3EE"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="82" r="3" fill="#A78BFA"><animate attributeName="opacity" values="1;.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="278" r="2.5" fill="#22D3EE"><animate attributeName="opacity" values=".15;1;.15" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="195" cy="286" r="2.5" fill="#A78BFA"><animate attributeName="opacity" values="1;.15;1" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <g stroke="url(#line)" stroke-width="1.4" opacity=".55">
    <path d="M120 118 H278 L330 170 H430"/>
    <path d="M1080 118 H922 L870 170 H770"/>
    <path d="M120 242 H288 L344 198 H430"/>
    <path d="M1080 242 H912 L856 198 H770"/>
  </g>

  <g fill="#0B1024" stroke="#22D3EE" stroke-opacity=".75">
    <circle cx="430" cy="170" r="8"/><circle cx="430" cy="198" r="8"/>
  </g>
  <g fill="#0B1024" stroke="#8B5CF6" stroke-opacity=".8">
    <circle cx="770" cy="170" r="8"/><circle cx="770" cy="198" r="8"/>
  </g>

  <g filter="url(#glow)">
    <rect x="474" y="100" width="252" height="150" rx="28" fill="#0A1024" stroke="#67E8F9" stroke-opacity=".65"/>
    <path d="M536 146H664M536 178H664M558 210H642" stroke="#67E8F9" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <circle cx="515" cy="146" r="6" fill="#22D3EE"/>
    <circle cx="685" cy="178" r="6" fill="#8B5CF6"/>
    <circle cx="525" cy="210" r="5" fill="#A78BFA"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4s" repeatCount="indefinite"/>
  </g>

  <text x="600" y="298" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700" letter-spacing=".6">Othmane Achir</text>
  <text x="600" y="330" text-anchor="middle" fill="#A5B4FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" letter-spacing="1.8">AI-NATIVE SYSTEMS • SOFTWARE ENGINEERING • DIGITAL PRODUCTS</text>

  <rect x="1" y="1" width="1198" height="358" rx="29" stroke="url(#line)" stroke-opacity=".35" stroke-width="2"/>
</svg>
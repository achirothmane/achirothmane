name: Portfolio Evidence Validation
on:
  push:
    branches:
      - main
    paths:
      - "SYSTEM-MAP.md"
      - "portfolio/**"
      - ".github/workflows/portfolio-evidence.yml"
  pull_request:
    paths:
      - "SYSTEM-MAP.md"
      - "portfolio/**"
      - ".github/workflows/portfolio-evidence.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generators dependency
        run: python -m pip install -r portfolio/requirements.txt
      - name: Validate public evidence and freshness
        run: python portfolio/scripts/check_evidence_baseline.py --fail-on-stale
      - name: Validate Python syntax
        run: |
          python -m py_compile portfolio/scripts/check_evidence_baseline.py
          python -m py_compile portfolio/scripts/generate_freshness_report.py
          python -m py_compile portfolio/scripts/generate_priority_report.py
          python -m py_compile portfolio/scripts/generate_dependency_graph.py
      - name: Verify generated reports are current
        run: |
          python portfolio/scripts/generate_dependency_graph.py
          python portfolio/scripts/generate_freshness_report.py --as-of "$(python -c 'import json; print(json.load(open("portfolio/freshness-report.json"))["as_of"])')"
          python portfolio/scripts/generate_priority_report.py
          git diff --exit-code -- \
            portfolio/DEPENDENCY-GRAPH.md \
            portfolio/dependency-graph.json \
            portfolio/FRESHNESS-REPORT.md \
            portfolio/freshness-report.json \
            portfolio/PRIORITY-REPORT.md \
            portfolio/priority-report.json
      - name: Run Dots shadow policy falsification tests
        run: |
          python -m unittest discover -s portfolio/tests -p 'test_shadow_*.py' -v
      - name: Verify immutable shadow reference on its recorded snapshot
        run: |
          python portfolio/scripts/shadow_management.py --check-reference --as-of "$(python -c 'import json; print(json.load(open("portfolio/priority-report.json"))["as_of"])')"
      - name: Fail closed when current shadow inputs expire
        run: |
          python portfolio/scripts/shadow_management.py --as-of "$(date -u +%F)" > /dev/null
      - name: Verify S1 provenance readiness (no paid calls)
        run: |
          python -m unittest discover -s portfolio/tests -p 'test_shadow_live_gate.py' -v
          python portfolio/scripts/shadow_live_gate.py --check-reference --as-of "$(python -c 'import json; print(json.load(open("portfolio/priority-report.json"))["as_of"])')"
          python portfolio/scripts/shadow_live_gate.py --as-of "$(date -u +%F)" > /dev/null

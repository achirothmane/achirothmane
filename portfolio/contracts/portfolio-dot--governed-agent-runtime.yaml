  version: 1
  status: VERIFIED_RELATIONSHIP
  source_project: portfolio-dot
  target_project: governed-agent-runtime
  relations:
    - COMPOSES_WITH
  hard_dependency: false
  purpose: provide durable execution and capability binding for Dots without turning the runtime into the portfolio authority
  source_owns:
    - portfolio coordination decisions
    - admitted objective and authority
  target_owns:
    - runtime fingerprint binding
    - Temporal durability
    - tool invocation durability
    - reasoning execution durability

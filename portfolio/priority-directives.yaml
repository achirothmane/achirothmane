      next_action: maintain consumer-path proof only when needed for the E1/adoption question

    - project: workflow-failure-lab
      lane: WATCH
      reason: evidence-support asset for CI reliability work
      next_action: add failure evidence only when it answers a live product or integration question

    - project: mini-foot
      lane: NEXT
      reason: active product experiment with a clear retention gate
      next_action: reach enjoyable playable feel and voluntary rematch evidence
      constraints:
        - prioritize-football-feel
        - no-store-or-menu-expansion-before-feel-gate

    - project: releaseguard-n8n
      lane: WATCH
      reason: competitive review dated 2026-10-10 found generic release features well-served by native and open-source alternatives, while paid demand for the narrower measured canary remains unverified
      next_action: COMMERCIAL_HOLD; preserve engineering evidence; no new commercial features or selling experiment until an independently evidenced buyer use case and the Competitive Freshness Gate are satisfied
      constraints:
        - commercial-hold-no-feature-expansion
        - no-assumed-sales-or-zero-sales
        - preserve-existing-user-obligations
        - no-new-NOW-or-Dot-authority

    - project: conversion-truth-auditor

priority_directives:
  schema_version: 1
  as_of: 2026-10-09
  last_operational_revalidation: 2026-10-09
  revalidation_note: operational facts updated; original human priority lanes preserved
  authority: human-strategic-decisions
  focus:
    - project: data-engine
      lane: NOW
      reason: broad self-use foundational asset that compounds across future systems
      next_action: "PR #7 already merged 2026-10-07; verify current main and individually review outstanding reconciliation PRs against evidence"
      constraints:
        - do-not-narrow-commercially-early
        - capability-and-boundary-must-ship-together

    - project: governed-agent-runtime
      lane: NOW
      reason: human-authorized single read-only Dots shadow observation; not a general runtime expansion
      next_action: "Use sealed Portfolio context to propose one next evidence-verification gate; separately let a human compare merged PR #25 #28 #29 and CI"

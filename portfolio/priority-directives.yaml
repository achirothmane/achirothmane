        - no-early-niche-narrowing
        - commercial-narrowing-last

    - project: ci-retry-gate-engine
      lane: WATCH
      reason: engineering is frozen while waiting for E1 real-exposure evidence
      next_action: observe for real exposure and E1; do not add features merely to create activity
      constraints:

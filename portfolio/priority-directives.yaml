      reason: commercial value still needs evidence before more engineering
      next_action: establish differentiated economic value and packaging before new build work

    - project: postgres-change-safety
      lane: NEXT
      reason: product asset with a concrete value-validation gate
      next_action: prove repeatable user value and packaging

    - project: private-code-modernization-factory
      lane: NEXT
      reason: retest candidate with explicit verification and onboarding gaps
      next_action: prove reliable verification and onboarding before expansion

    - project: easl
      lane: PARKED
      reason: reusable primitive must not become a required dependency without a real consumer
      next_action: reactivate only when a concrete downstream consumer proves value

    - project: assumption-gate
      lane: PARKED
      reason: reusable primitive awaiting a real consumer
      next_action: reactivate only for a concrete consumer integration

    - project: token-governance-protocol
      lane: PARKED
      reason: reusable primitive awaiting a genuine token-budget consumer
      next_action: reactivate only for a real agent or model execution budget need

    - project: intelligence-layer
      lane: PARKED
      reason: do not create a standalone layer until a real second consumer exists
      next_action: keep reasoning capability inside the consuming system until extraction is justified

    - project: revenue-engine
      lane: PARKED
      reason: deferred by design until upstream data and marketing capabilities produce real operational evidence
      next_action: wait for upstream evidence

    - project: aegis-ege

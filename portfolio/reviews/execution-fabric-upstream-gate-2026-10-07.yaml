    proven:
      - Kestra OSS can execute two materially different portfolio domains through the same Process runner model
      - consumers remain independently runnable and do not become hard dependencies on Execution Fabric
      - orchestration state remains separate from consumer semantic decisions
      - required evidence can be hash-bound and retained
      - Kestra runtime can be isolated outside consumer checkouts
      - strict tracked and untracked checkout cleanliness can be enforced
      - no Enterprise-only Kestra capability is required by either proof

    learned_boundaries:
      - Kestra 2.0.5 requires JDK 25 in the tested standalone path
      - local API access requires Basic Auth
      - Kestra 2.0 task outputs are fetched through /outputs/tasks/{executionId}/{taskRunId}
      - local Kestra runtime must not run from a consumer checkout
      - checkout integrity must be checked with git status --porcelain, not only git diff
      - language-specific runtime writes such as Python bytecode must not pollute consumer repositories

    remaining_unproven:
      - operational time or failure savings from repeated real product use
      - a concrete recurring architectural divergence that warrants owning a Kestra hard fork
      - fork ownership and upstream-sync policy if such a divergence eventually appears

    decision: KEEP_UPSTREAM_COMPATIBLE_COMPOSITION_DO_NOT_FORK
    next_gate: >
      Stop infrastructure expansion. Reuse Adapter v0.1 only when an active product has a real
      workflow that benefits from shared execution. Measure operational time/failure savings
      from that real use. Admit a hard fork only if a specific recurring architectural
      divergence makes ownership economically and technically superior.

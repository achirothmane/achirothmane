review:
  id: execution-fabric-upstream-gate-2026-10-07
  reviewed_at: 2026-10-07
  goal: >
    Select a legally and technically suitable upstream for a single internal execution
    fabric that can coordinate real workflows across independently owned portfolio projects.
  doctrine:
    - single Dots coordination model remains above the project graph
    - no dependency without a real flow
    - internal usefulness before commercial narrowing
    - do not revive a generic agent-control or orchestration platform as the commercial product
    - hard fork only after a repeated self-use divergence is proven
  candidates:
    activepieces:
      repository: activepieces/activepieces
      licensing:
        open_core: MIT outside enterprise directories
        enterprise: commercial
      strengths:
        - strong SaaS integration/pieces ecosystem
        - TypeScript extensibility
        - webhook and automation UX
      constraints:
        - some private-piece and platform administration capabilities are paid
        - overlaps more directly with Marketing Automation Suite
      decision: SECONDARY_INTEGRATION_SOURCE
    windmill:
      repository: windmill-labs/windmill
      licensing:
        backend_frontend: AGPLv3 unless otherwise specified
        clients_and_openflow: Apache-2.0
        enterprise: proprietary
        distributed_community_edition: contains additional proprietary restrictions
      strengths:
        - strong developer workflow and script execution model
        - polyglot and infrastructure oriented
      constraints:
        - licensing mix is unattractive for the intended owned hard-fork asset
      decision: REJECT_AS_HARD_FORK_BASE
    kestra:
      repository: kestra-io/kestra
      licensing:
        repository: Apache-2.0
      strengths:
        - event and workflow orchestration
        - polyglot script execution
        - open-source Docker and Process task runners
        - clean permissive base for modification and distribution
      constraints:
        - heavier JVM/runtime footprint than a connector-first automation tool
        - some remote/cloud task runners and governance capabilities are Enterprise-only
      decision: SELECT_FOR_BOUNDED_SPIKE
  decision:
    outcome: SELECT_KESTRA_FOR_SPIKE_NOT_FORK_YET
    reason: >
      Kestra best matches the portfolio's need for a neutral polyglot execution substrate
      while keeping the upstream license permissive. A fork is not yet justified because
      we have not demonstrated a recurring architectural divergence.
  first_spike:
    consumer: data-engine
    objective: >
      Trigger one real Data Engine job through Kestra, capture the Data Engine's own
      evidence/result artifacts, propagate success/failure/unknown state, and emit a
      machine-readable execution record.
    must_prove:
      - no Enterprise-only feature is required
      - project ownership stays in data-engine
      - execution does not rewrite Data Engine evidence
      - failure is observable and reproducible
      - orchestration removes meaningful manual glue
  hard_fork_entry_conditions:
    - at least one repeated internal workflow proves utility
    - a concrete upstream divergence is identified
    - maintaining the divergence is cheaper than external glue
    - required capabilities remain legally usable in the chosen open-source boundary
    - fork ownership and upstream-sync policy are explicit
  kill_conditions:
    - required capability depends on paid Enterprise features
    - orchestration overhead exceeds the manual glue it replaces
    - the fabric starts absorbing product-specific business logic
    - the project drifts toward selling a generic orchestration platform
  commercial_role:
    direct_product: false
    role: compounding internal infrastructure that accelerates revenue-bearing products
  sources:
    - https://github.com/kestra-io/kestra
    - https://github.com/activepieces/activepieces
    - https://github.com/windmill-labs/windmill

  spike_status:
    state: PASS_BOUNDED_SPIKE
    harness_path: portfolio/spikes/kestra-data-engine
    data_engine_pull_request: 10
    data_engine_spike_branch: spike/kestra-execution-fabric
    target_data_engine_main: 154b92d4c464a2e0a8646ba1709d16f7ecba7c76
    final_ci:
      run_id: 37583709577
      conclusion: success
      test_job: success
      kestra_spike_job: success
      evidence_artifact_id: 11465352137
      evidence_artifact_name: kestra-data-engine-spike
      evidence_artifact_bytes: 10478
    kestra:
      version: 2.0.5
      runtime_jdk: 25
      runner: io.kestra.plugin.core.runner.Process
      enterprise_feature_required: false
      execution_id: 2UkqKuYaKbeZuU7YdKC4p0
    execution_record:
      orchestration_state: KNOWN_SUCCESS
      reason: PROCESS_AND_ARTIFACTS_OBSERVED
      engine_process_exit: 0
      evidence_authority: data-engine
      orchestrator_mutates_evidence: false
      data_publishable: true
      data_quality:
        entities: 3
        coverage: 1
        mean_confidence: 0.9513333333333333
        conflicting_cells: 0
        unknown_cells: 0
      artifact_hashes:
        dataset_csv: 24417a0ce98888e93a2ff425fab88848fa9f29de76eb0e2837ec0a39aec9b9fa
        provenance_jsonl: fc968acdf74fa2c632966a8dab7a84b460a1eabcac098226c81cfeb8c96a95db
        quality_json: 08d8ac2cbf22580a3be33878b2e3c8df0d464b89ae7282e7caf0f6fffc556b35
        result_json: 32c5f58426f9f9da5042b9c05c2fa085eb44057ef9978375cfab2a4dc8efb412
    proven:
      - Kestra OSS starts and authenticates in a clean GitHub Actions runner
      - Kestra creates and executes the Data Engine flow through the OSS Process runner
      - Data Engine exits zero and emits all required evidence/result artifacts
      - orchestration state remains separate from Data Engine publishability
      - required artifacts are hashed and retained in Kestra internal storage
      - the tracked Data Engine checkout remains clean after orchestration
      - no Enterprise-only Kestra feature is required for this proof
    learned_boundaries:
      - Kestra 2.0.5 requires JDK 25 in this tested standalone path
      - local API access requires Basic Auth
      - Kestra 2.0 task outputs are fetched through /outputs/tasks/{executionId}/{taskRunId}
    remaining_unproven:
      - repeated utility across more than one portfolio workflow
      - measurable reduction in manual glue over repeated operation
      - a concrete architectural divergence that justifies owning a Kestra hard fork
    decision: KEEP_KESTRA_AS_PROVEN_UPSTREAM_CANDIDATE_DO_NOT_FORK_YET
    next_gate: >
      Run a second distinct real portfolio workflow through the same fabric, preferably a
      revenue-bearing or developer-tool path, and measure whether reuse is materially cheaper
      and safer than project-specific glue before admitting a hard fork.
